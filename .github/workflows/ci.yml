name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

defaults:
  run:
    working-directory: backend

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          version: "latest"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --locked

      - name: Ruff lint
        run: uv run ruff check src/

      - name: Mypy type-check
        run: uv run mypy src/

      - name: Pytest
        run: uv run pytest -q
        env:
          AWARE_JWT_SECRET_KEY: ci-test-secret-key-not-used-in-production
          AWARE_DATABASE_URL: postgresql+asyncpg://user:password@localhost/aware
          AWARE_TEST_DATABASE_URL: ${{ secrets.NEON_TEST_DATABASE_URL }}
